# Physics engines: core physics providers.
# `fields` sets the row order and labels; every engine should have each field.

fields:
  integration_method: Integration Method
  articulation: Articulation
  collision_detection: Collision Detection
  constraint_problem: Constraint Problem
  rigid_body_solver: Rigid-body Solver
  soft_body_fluid_solver: Soft-body or Fluid Dynamics/Solver
  parallelization: Parallelization
  differentiable: Differentiable
  developer: Developer
  release_year: Release Year
engines:
  ODE:
    url: https://www.ode.org
    integration_method: [ EE ]
    articulation: [ CRBA ]
    collision_detection: [ Point ]
    constraint_problem: [ LCP ]
    rigid_body_solver: [ PGS ]
    soft_body_fluid_solver: [ None ]
    parallelization: [ None ]
    differentiable: false
    developer: One guy, Russ Smith
    release_year: 2001
  Bullet:
    url: https://github.com/bulletphysics/bullet3
    integration_method: [ SE ]
    articulation: [ ABA ]
    collision_detection: [ Point ]
    constraint_problem: [ LCP, SI ]
    rigid_body_solver: [ PGS ]
    soft_body_fluid_solver: [ PBD ]
    parallelization: [ Single-scene CPU ]
    differentiable: false
    developer: One guy, [Erwin Coumans](https://github.com/erwincoumans)
    release_year: 2006
  PhysX:
    url: https://nvidia-omniverse.github.io/PhysX/
    integration_method: [ SE ]
    articulation: [ ABA ]
    collision_detection: [ Point ]
    constraint_problem: [ "SI ([Docs](https://nvidia-omniverse.github.io/PhysX/physx/5.6.1/docs/RigidBodyDynamics.html))" ]
    rigid_body_solver: [ PGS ]
    soft_body_fluid_solver: [ FEM, PBD ]
    parallelization: [ Single-scene CPU, GPU ]
    differentiable: false
    developer: NVIDIA
    release_year: 2008
  MuJoCo:
    url: https://mujoco.readthedocs.io/en/stable/overview.html
    integration_method: [ EE, IE, SE, RK4 ]
    articulation: [ CRBA ]
    collision_detection: [ Point ]
    constraint_problem: [ Soft ]
    rigid_body_solver: [ Newton, CG, PGS ]
    soft_body_fluid_solver: [ None ]
    parallelization: [ CPU, "GPU using [MJX](https://mujoco.readthedocs.io/en/stable/mjx.html), [MJWarp](https://github.com/google-deepmind/mujoco_warp)" ]
    differentiable: false
    developer: Roboti LLC, acquired by Google DeepMind
    release_year: 2012
  Drake:
    url: https://drake.mit.edu/
    integration_method: [ Adaptive RK ]
    articulation: [ ABA ]
    collision_detection: [ Hydroelastic ]
    constraint_problem: [ CCP, SAP ]
    rigid_body_solver: [ Newton ]
    soft_body_fluid_solver: [ FEM ]
    parallelization: [ No ]
    differentiable: false
    developer: MIT, funded by Toyota
    release_year: 2014
  RaiSim:
    url: https://raisim.com
    integration_method: [ SE ]
    articulation: [ ABA ]
    collision_detection: [ Point ]
    constraint_problem: [ (Closed source) ]
    rigid_body_solver: [ (Closed source) ]
    soft_body_fluid_solver: [ None ]
    parallelization: [ No ]
    differentiable: false
    developer: For-profit spinoff from ETH Zurich
    release_year: 2018
  Brax:
    url: https://github.com/google/brax
    integration_method: [ SE ]
    articulation: [ CRBA ]
    collision_detection: [ Point ]
    constraint_problem: [ SI, Soft ]
    rigid_body_solver: [ PBD ]
    soft_body_fluid_solver: [ None ]
    parallelization: [ "GPU using [MJX](https://mujoco.readthedocs.io/en/stable/mjx.html)" ]
    differentiable: true
    developer: Google
    release_year: 2021
  Jolt:
    url: https://github.com/jrouwe/JoltPhysics
    integration_method: [ SE ]
    articulation: [ ABA ]
    collision_detection: [ Point ]
    constraint_problem: [ SI ]
    rigid_body_solver: [ PGS ]
    soft_body_fluid_solver: [ None ]
    parallelization: [ No ]
    differentiable: false
    developer: One guy, [Jorrit Rouwe](https://github.com/jrouwe)
    release_year: 2022
  Newton:
    url: https://github.com/newton-physics/newton
    integration_method: [ SE ]
    articulation: [ CRBA ]
    collision_detection: [ Point ]
    constraint_problem: [ CCP, Soft ]
    rigid_body_solver: [ Newton, CG, PGS ]
    soft_body_fluid_solver: [ MPM, VBD, XPBD ]
    parallelization: [ "Multi-scene GPU using [MJWarp](https://github.com/google-deepmind/mujoco_warp)" ]
    differentiable: true
    developer: NVIDIA
    release_year: 2025
  Genesis:
    url: https://github.com/Genesis-Embodied-AI/Genesis
    integration_method: [ IE, SE ]
    articulation: [ CRBA ]
    collision_detection: [ Hydroelastic, Point ]
    constraint_problem: [ CCP, Soft ]
    rigid_body_solver: [ Newton, CG, PGS ]
    soft_body_fluid_solver: [ FEM, IPC, MPM, PBD, SF, SPH ]
    parallelization: [ "Multi-scene GPU using [gstaichi](https://github.com/Genesis-Embodied-AI/gstaichi)." ]
    differentiable: true
    developer: "[Genesis AI](https://genesis-ai.company/)"
    release_year: 2025
